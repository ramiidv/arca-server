worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstream servers
    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Security headers. Ninguna location define add_header propio: si lo hiciera,
        # dejaría de heredar estas.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Proxy hacia backend y frontend (lo heredan todas las locations: ninguna define
        # sus propios proxy_set_header). HTTP/1.1 sin "Connection: close" para el keepalive
        # del upstream backend. X-Forwarded-For lo lee el backend con TRUST_PROXY=1.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;

        # Health check for Nginx itself
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
        }

        # Emisiones, recuperación y operaciones contra ARCA (generar certificado,
        # constatar, padrón...): pueden tardar hasta 120 s (TIMEOUT_EMISION en
        # frontend/src/api/client.ts). El proxy espera un poco más (130 s) para que
        # el backend llegue a responder en vez de cortar con 504. Es regex: tiene
        # prioridad sobre el prefijo /api/ de abajo.
        location ~ ^/api/(invoices|afip)(/|$) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;

            proxy_send_timeout 130s;
            proxy_read_timeout 130s;
        }

        # Resto de la API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;

            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Frontend (SPA)
        location / {
            proxy_pass http://frontend;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend;
                expires 1y; # Cache-Control: max-age (sin add_header, para heredar las cabeceras de seguridad)
            }
        }
    }
}
